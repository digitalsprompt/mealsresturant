services:
  - type: web
    plan: free
    name: resturant
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn resturant.asgi:application -k uvicorn.workers.UvicornWorker'
    static:
      - name: static
        path: /static
        source: staticfiles
